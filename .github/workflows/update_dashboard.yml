
name: refresh-metrics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Show repository structure
        run: |
          echo "Repository root:"
          ls -la
          echo "Solutions directory:"
          find solutions -maxdepth 2 -type d 2>/dev/null || true

      - name: Rebuild dashboard
        run: python scripts/generate_stats.py

      - name: Commit updated dashboard and organization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update LeetCode dashboard"
            git push
          fi
