name: Sync LeetCode Progress Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'Easy/**'
      - 'Medium/**'
      - 'Hard/**'
  workflow_dispatch: # This line forces GitHub to display the "Run workflow" button!

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Runtime environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild Dashboard Layout
        run: python scripts/generate_stats.py

      - name: Push Refreshed Readme
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git commit -m "docs: auto-refresh leetcode dashboard grids [skip ci]" || exit 0
          git push
